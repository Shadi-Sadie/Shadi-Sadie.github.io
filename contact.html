<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Shadi Seyedi, PhD</title>
  <meta name="description" content="Get in touch with Shadi Seyedi." />

  <meta property="og:title" content="Contact — Shadi Seyedi, PhD" />
  <meta property="og:site_name" content="Shadi Seyedi" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://shadi-sadie.github.io/contact.html" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/icons/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/assets/icons/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180">

  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header>
    <div class="wrap nav" id="topnav">
      <a href="/" class="brand">Shadi <span>Seyedi</span></a>
      <button class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"
        onclick="(function(){const top=document.getElementById('topnav');const btn=event.currentTarget;const open=top.classList.toggle('open');btn.setAttribute('aria-expanded', open);})();">
        <svg class="hamburger" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="18" height="2" rx="1" fill="currentColor"></rect>
          <rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor"></rect>
          <rect x="3" y="16" width="18" height="2" rx="1" fill="currentColor"></rect>
        </svg>
        <span class="sr-only">Menu</span>
      </button>
      <nav>
        <ul id="mobile-menu">
          <li><a href="/about.html">About</a></li>
          <li><a href="/research.html">Research</a></li>
          <li><a href="/projects.html">Projects</a></li>
          <li><a href="/contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap page-main" tabindex="-1">
    <section id="contact">
      <h1>Get in touch</h1>

      <div id="form-area">
        <form class="contact-form"
              action="https://api.web3forms.com/submit"
              method="POST">
          <input type="hidden" name="access_key" value="2d327e98-9030-4e29-b5b5-698b93c917f4">
          <input type="hidden" name="subject" value="Message from your website">
          <input type="hidden" name="redirect" value="https://shadi-sadie.github.io/contact.html?sent=1">
          <input type="checkbox" name="botcheck" class="sr-only" tabindex="-1" autocomplete="off">

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your name" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com" />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="Your message"></textarea>
          </div>

          <button type="submit" class="btn primary">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p>© <span id="y"></span> Shadi Seyedi</p>
    </div>
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    if (new URLSearchParams(window.location.search).get('sent') === '1') {
      document.getElementById('form-area').innerHTML =
        '<p class="form-sent">Message sent — thank you. I\'ll be in touch.</p>';
    }
  </script>
</body>
</html>
